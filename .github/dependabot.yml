version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  - package-ecosystem: pip
    directory: /PlaywrightSelfHealer
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    groups:
      dev-tools:
        patterns: ["pytest*", "ruff"]
