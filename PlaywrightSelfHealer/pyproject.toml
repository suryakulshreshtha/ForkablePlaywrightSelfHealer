[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forkable-ai-agent"
version = "0.1.0"
description = "Self-healing Playwright tests: plan, generate, run, repair and explain UI + API tests offline, heuristic-first with an optional local LLM."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Surya Kulshreshtha" }]
keywords = ["playwright", "testing", "self-healing", "test-automation", "pytest", "ollama", "local-llm", "rag", "offline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]

# The agent core deliberately has no runtime dependency beyond Playwright.
# Planning, RAG, healing, codegen and reporting all run on the standard library.
dependencies = ["playwright>=1.40,<2"]

[project.optional-dependencies]
visual = ["pillow>=10.0"]
chroma = ["chromadb>=0.5"]            # only if you want to share the sibling repo's store
dev = [
    "pytest>=8.0",
    "pytest-playwright>=0.5",
    "pytest-cov>=5.0",
    "pillow>=10.0",
    "ruff>=0.5",
]

[project.scripts]
forkable = "forkable_ai_agent.cli:main"

[project.urls]
Repository = "https://github.com/suryakulshreshtha/ForkablePlaywrightSelfHealer"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.coverage.run]
source = ["src/forkable_ai_agent"]
branch = false

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise NotImplementedError"]
